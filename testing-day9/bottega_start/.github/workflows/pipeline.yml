# Pipeline di partenza della G4: accende corriere e Bottega con gunicorn e lancia i test.
# Oggi la estendiamo: report (Lab 2, Livello 2) e deploy in produzione (Lab 3).
name: Pipeline Bottega

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Test (Quality Gate)
    runs-on: ubuntu-latest
    steps:
      - name: Scarico il codice
        uses: actions/checkout@v7

      - name: Installo Python (la versione è scritta in .python-version)
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Installo le dipendenze di test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Accendo il corriere e la Bottega (con gunicorn, come in produzione)
        run: |
          gunicorn corriere:app --bind 127.0.0.1:8001 --daemon --error-logfile corriere.log
          gunicorn app:app --bind 127.0.0.1:8000 --daemon --error-logfile app.log
          for tentativo in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/api/health && exit 0
            sleep 1
          done
          echo "La Bottega non si è accesa in 20 secondi" >&2
          exit 1

      # --ignore=tests/e2e: i test del browser (G3) in CI richiedono Playwright e i browser.
      # Qui non ci sono: senza questa opzione la raccolta dei test si ferma con un errore.
      - name: Eseguo i test
        run: pytest -v --ignore=tests/e2e
